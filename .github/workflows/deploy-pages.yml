name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build user website
        run: |
          npm ci
          npm run build
        working-directory: advocate-user-website

      - name: Build admin panel
        run: |
          npm ci
          npm run build
        working-directory: advocate-admin-panel

      - name: Merge builds
        run: |
          mkdir -p deploy
          cp -r advocate-user-website/dist/. deploy/
          mkdir -p deploy/admin
          cp -r advocate-admin-panel/dist/. deploy/admin/
          cp advocate-user-website/public/404.html deploy/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
