name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync frontend to gh-pages
        run: |
          cp -r frontend /tmp/frontend-deploy

          git checkout gh-pages

          rsync -av --delete \
            --exclude='.git' \
            --exclude='admin' \
            /tmp/frontend-deploy/ ./

          git add -A
          git diff --cached --quiet && git commit --allow-empty -m "chore: trigger Pages deploy" || git commit -m "chore: deploy from main"
          git push origin gh-pages
