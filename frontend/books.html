<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books for Sale — Advocate Chauhan</title>
  <link rel="stylesheet" href="css/fa-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-hero { background: linear-gradient(135deg,#0a1628 0%,#112240 100%); padding: 100px 0 60px; text-align: center; }
    .page-hero h1 { color: #fff; font-size: 2.5rem; } .page-hero p { color: #c9a84c; margin-top: 10px; }
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; padding: 60px 0; }
    .book-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.08); transition: transform .2s; }
    .book-card:hover { transform: translateY(-4px); }
    .book-img { width: 100%; height: 220px; object-fit: cover; background: #f4f6f9; display: flex; align-items: center; justify-content: center; }
    .book-img img { width: 100%; height: 220px; object-fit: cover; }
    .book-img-placeholder { font-size: 52px; color: #c9a84c; }
    .book-body { padding: 18px; }
    .book-name { font-size: 16px; font-weight: 700; color: #0a1628; }
    .book-author { font-size: 12px; color: #888; margin: 4px 0 10px; }
    .book-price { font-size: 20px; font-weight: 700; color: #c9a84c; margin-bottom: 8px; }
    .book-desc { font-size: 13px; color: #666; margin-bottom: 14px; }
    .stock-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 12px; }
    .stock-available { background: rgba(67,160,71,.12); color: #43a047; }
    .stock-out { background: rgba(229,57,53,.1); color: #e53935; }
    .btn-enquire { background: #c9a84c; color: #0a1628; padding: 10px 0; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; width: 100%; cursor: pointer; }
    .btn-enquire:hover { background: #0a1628; color: #c9a84c; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; width: 480px; max-width: 95vw; padding: 28px; }
    .modal h3 { color: #0a1628; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
    .btn-submit { background: #c9a84c; color: #0a1628; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; width: 100%; cursor: pointer; margin-top: 8px; }
    .btn-cancel { background: #f4f6f9; color: #333; padding: 10px; border: none; border-radius: 8px; font-size: 14px; width: 100%; cursor: pointer; margin-top: 6px; }
    #toast { position: fixed; bottom: 24px; right: 24px; background: #43a047; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 9999; display: none; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container"><a class="navbar-brand" href="index.html"><img src="logo.jpeg" height="50" alt="Logo"> <span>Advocate Chauhan</span></a></div>
  </nav>
  <div class="page-hero"><div class="container"><h1><i class="fas fa-book" style="color:#c9a84c"></i> Books for Sale</h1><p>Legal books and publications by Advocate Chauhan</p></div></div>
  <div class="container">
    <div class="books-grid" id="books-grid"><div style="text-align:center;padding:80px 0;color:#888"><i class="fas fa-spinner fa-spin fa-2x"></i></div></div>
  </div>

  <div class="modal-overlay" id="enquiry-modal">
    <div class="modal">
      <h3><i class="fas fa-shopping-bag" style="color:#c9a84c"></i> Book Enquiry</h3>
      <input type="hidden" id="eq-book" />
      <input type="hidden" id="eq-price" />
      <div class="form-group"><label>Your Name *</label><input id="eq-name" placeholder="Full name" /></div>
      <div class="form-group"><label>Phone *</label><input id="eq-phone" placeholder="+91 XXXXX XXXXX" /></div>
      <div class="form-group"><label>Email *</label><input id="eq-email" type="email" placeholder="your@email.com" /></div>
      <div class="form-group"><label>Quantity</label><input id="eq-qty" type="number" value="1" min="1" /></div>
      <div class="form-group"><label>Delivery Address *</label><textarea id="eq-address" rows="3" placeholder="Full delivery address"></textarea></div>
      <div class="form-group"><label>Message</label><textarea id="eq-msg" rows="2" placeholder="Any special instructions..."></textarea></div>
      <button class="btn-submit" onclick="submitEnquiry()"><i class="fas fa-paper-plane"></i> Submit Enquiry</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
  <div id="toast"></div>
  <script>
    const API = 'https://chauhanadvocate.onrender.com';
    fetch(API + '/api/books').then(r=>r.json()).then(d => {
      const items = d.data || [];
      const grid = document.getElementById('books-grid');
      if (!items.length) { grid.innerHTML = '<div style="text-align:center;padding:80px 0;color:#888"><i class="fas fa-book fa-3x" style="color:#c9a84c;margin-bottom:16px"></i><br>No books available yet.</div>'; return; }
      grid.innerHTML = items.map(b => `
        <div class="book-card">
          <div class="book-img">${b.image ? `<img src="${API}${b.image}" alt="${b.name}">` : `<div class="book-img-placeholder"><i class="fas fa-book"></i></div>`}</div>
          <div class="book-body">
            <div class="book-name">${b.name}</div>
            ${b.author ? `<div class="book-author">by ${b.author}</div>` : ''}
            <div class="book-price">₹${b.price}</div>
            <span class="stock-badge ${b.stockStatus==='available'?'stock-available':'stock-out'}">${b.stockStatus==='available'?'In Stock':'Out of Stock'}</span>
            ${b.description ? `<div class="book-desc">${b.description}</div>` : ''}
            ${b.stockStatus==='available' ? `<button class="btn-enquire" onclick='openEnquiry("${b.name}","${b.price}")'>Enquire / Buy</button>` : `<button class="btn-enquire" style="opacity:.5;cursor:not-allowed" disabled>Out of Stock</button>`}
          </div>
        </div>`).join('');
    });

    function openEnquiry(name, price) {
      document.getElementById('eq-book').value = name;
      document.getElementById('eq-price').value = price;
      document.getElementById('enquiry-modal').classList.add('open');
    }
    function closeModal() { document.getElementById('enquiry-modal').classList.remove('open'); }

    async function submitEnquiry() {
      const name=document.getElementById('eq-name').value, phone=document.getElementById('eq-phone').value,
        email=document.getElementById('eq-email').value, address=document.getElementById('eq-address').value;
      if (!name||!phone||!email||!address) { alert('Please fill all required fields'); return; }
      try {
        const r = await fetch(API+'/api/book-orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, phone, email, bookTitle:document.getElementById('eq-book').value, bookPrice:document.getElementById('eq-price').value, quantity:parseInt(document.getElementById('eq-qty').value)||1, address, notes:document.getElementById('eq-msg').value }) });
        const d = await r.json();
        if (d.success) { closeModal(); const t=document.getElementById('toast'); t.textContent='Enquiry submitted! We will contact you soon.'; t.style.display='block'; setTimeout(()=>t.style.display='none',4000); }
        else alert(d.message||'Failed to submit');
      } catch(e) { alert('Error submitting enquiry'); }
    }
  </script>
</body>
</html>
