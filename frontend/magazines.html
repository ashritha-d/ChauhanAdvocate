<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magazines — Advocate Chauhan</title>
  <link rel="stylesheet" href="css/fa-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-hero { background: linear-gradient(135deg,#0a1628 0%,#112240 100%); padding: 100px 0 60px; text-align: center; }
    .page-hero h1 { color: #fff; font-size: 2.5rem; } .page-hero p { color: #c9a84c; margin-top: 10px; }
    .magazines-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; padding: 60px 0; }
    .mag-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.08); transition: transform .2s; }
    .mag-card:hover { transform: translateY(-4px); }
    .mag-cover { width: 100%; height: 200px; object-fit: cover; background: #f4f6f9; display: flex; align-items: center; justify-content: center; }
    .mag-cover img { width: 100%; height: 200px; object-fit: cover; }
    .mag-cover-placeholder { font-size: 48px; color: #c9a84c; }
    .mag-body { padding: 18px; }
    .mag-title { font-size: 16px; font-weight: 700; color: #0a1628; margin-bottom: 6px; }
    .mag-desc { font-size: 13px; color: #666; margin-bottom: 14px; }
    .mag-date { font-size: 12px; color: #999; margin-bottom: 12px; }
    .btn-gold { background: #c9a84c; color: #0a1628; padding: 9px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; display: inline-block; }
    .empty-state { text-align: center; padding: 80px 0; color: #888; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container"><a class="navbar-brand" href="index.html"><img src="logo.jpeg" height="50" alt="Logo"> <span>Advocate Chauhan</span></a></div>
  </nav>
  <div class="page-hero"><div class="container"><h1><i class="fas fa-book-open" style="color:#c9a84c"></i> Magazines</h1><p>Legal publications and articles by Advocate Chauhan</p></div></div>
  <div class="container">
    <div class="magazines-grid" id="magazines-grid"><div class="empty-state"><i class="fas fa-spinner fa-spin fa-2x"></i></div></div>
  </div>
  <script>
    const API = 'https://chauhanadvocate.onrender.com';
    fetch(API + '/api/magazines').then(r=>r.json()).then(d => {
      const items = d.data || [];
      const grid = document.getElementById('magazines-grid');
      if (!items.length) { grid.innerHTML = '<div class="empty-state"><i class="fas fa-book-open fa-3x" style="color:#c9a84c;margin-bottom:16px"></i><br>No magazines published yet.</div>'; return; }
      grid.innerHTML = items.map(m => `
        <div class="mag-card">
          <div class="mag-cover">${m.coverImage ? `<img src="${API}${m.coverImage}" alt="${m.title}">` : `<div class="mag-cover-placeholder"><i class="fas fa-book-open"></i></div>`}</div>
          <div class="mag-body">
            <div class="mag-title">${m.title}</div>
            ${m.description ? `<div class="mag-desc">${m.description}</div>` : ''}
            <div class="mag-date"><i class="far fa-calendar"></i> ${new Date(m.publishedDate).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div>
            ${m.pdfFile ? `<a href="${API}${m.pdfFile}" target="_blank" class="btn-gold"><i class="fas fa-file-pdf"></i> Read / Download</a>` : ''}
          </div>
        </div>`).join('');
    }).catch(() => { document.getElementById('magazines-grid').innerHTML = '<div class="empty-state">Failed to load magazines.</div>'; });
  </script>
</body>
</html>
